services:
  oled:
    build: .
    restart: unless-stopped
    devices:
      - /dev/i2c-1:/dev/i2c-1
    volumes:
      - /:/host:ro   # only so disk usage reflects the host
    healthcheck:
      # No curl in the slim image; urlopen raises on a 503, failing the check.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
